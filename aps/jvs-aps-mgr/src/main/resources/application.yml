server:
  port: 31010
  servlet:
    context-path: /mgr/jvs-aps
spring:
  application:
    name: jvs-aps
  redis:
    host: localhost
    port: 6379
    timeout: 10000
    database: 2
    password: redis
  datasource:
    url: jdbc:mysql://localhost:3307/jvs-aps?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource


#日志配置
logging:
  #使用logstash方式日志传递
  config: classpath:logback-logstash.xml
  level:
    org.springframework.web.client.RestTemplate: DEBUG



mybatis-plus:
  configuration:
    cache-enabled: true
  global-config:
    db-config:
      logic-delete-field: delFlag

aps:
  small-model:
    enabled: ${APS_SMALL_MODEL_ENABLED:false}
    endpoint: ${APS_SMALL_MODEL_ENDPOINT:http://127.0.0.1:11434/v1/chat/completions}
    model: ${APS_SMALL_MODEL_NAME:qwen2.5:7b}
    response-format: ${APS_SMALL_MODEL_RESPONSE_FORMAT:JSON_OBJECT}
    api-key: ${APS_SMALL_MODEL_API_KEY:}
    timeout-seconds: ${APS_SMALL_MODEL_TIMEOUT_SECONDS:20}
    max-context-tasks: ${APS_SMALL_MODEL_MAX_CONTEXT_TASKS:200}
  # 缺料预警：投递推送与周期复评的后台任务。关掉后仍可 POST /shortage/scan 手工触发。
  shortage:
    worker-enabled: ${APS_SHORTAGE_WORKER_ENABLED:true}
    poll-ms: 2000
    sweep-ms: 300000
    # 生成回执链接 ackUrl 用的对外基地址。不配置就不下发，绝不把内网或本机地址发给外部渠道。
    public-base-url: ${APS_SHORTAGE_PUBLIC_BASE_URL:}
    # 拉取出站通道（给 ERP、SRM）。没人拉取时条目会堆在待投递，默认关闭。
    outbox-enabled: false
    # 邮件通道只对 P1、P2 生效，需另配 spring.mail.*。
    mail:
      enabled: ${APS_SHORTAGE_MAIL_ENABLED:false}
      from: ${APS_SHORTAGE_MAIL_FROM:}
    # 通用 webhook 接收端，每项含 name、tenant-id、url、secret、enabled。
    # secret 只从环境变量注入，不要写进仓库；tenant-id 留空表示全部租户。
    webhooks: []
    # 角色编码到邮箱列表。规则上的接收角色是编码，邮箱在这里静态维护，RBAC 落地前只能如此。
    role-recipients: {}
  auth:
    system-name: 智能APS
    allow-header-auth: false
    allow-query-fallback: false
    default-theme: darkblue
    default-language: zh_CN
    default-route: /productionSchedulingPlan
    users:
      - tenant-id: demo
        user-id: admin
        username: admin
        display-name: 管理员
        password: admin123
        theme: darkblue
        language: zh_CN
        default-route: /productionSchedulingPlan
        role-codes:
          - APS_ADMIN
