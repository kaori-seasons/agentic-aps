server:
  port: 31010
  servlet:
    context-path: /mgr/jvs-aps
spring:
  application:
    name: jvs-aps
  redis:
    host: localhost
    port: 6379
    timeout: 10000
    database: 2
    password: redis
  datasource:
    url: jdbc:mysql://localhost:3307/jvs-aps?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource


#日志配置
logging:
  #使用logstash方式日志传递
  config: classpath:logback-logstash.xml
  level:
    org.springframework.web.client.RestTemplate: DEBUG



mybatis-plus:
  configuration:
    cache-enabled: true
  global-config:
    db-config:
      logic-delete-field: delFlag

aps:
  small-model:
    enabled: ${APS_SMALL_MODEL_ENABLED:false}
    endpoint: ${APS_SMALL_MODEL_ENDPOINT:http://127.0.0.1:11434/v1/chat/completions}
    model: ${APS_SMALL_MODEL_NAME:qwen2.5:7b}
    response-format: ${APS_SMALL_MODEL_RESPONSE_FORMAT:JSON_OBJECT}
    api-key: ${APS_SMALL_MODEL_API_KEY:}
    timeout-seconds: ${APS_SMALL_MODEL_TIMEOUT_SECONDS:20}
    max-context-tasks: ${APS_SMALL_MODEL_MAX_CONTEXT_TASKS:200}
  auth:
    system-name: 智能APS
    allow-header-auth: false
    allow-query-fallback: false
    default-theme: darkblue
    default-language: zh_CN
    default-route: /productionSchedulingPlan
    users:
      - tenant-id: demo
        user-id: admin
        username: admin
        display-name: 管理员
        password: admin123
        theme: darkblue
        language: zh_CN
        default-route: /productionSchedulingPlan
        role-codes:
          - APS_ADMIN
